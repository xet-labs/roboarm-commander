<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>roboArm dashboard</title>
<style>
  :root { --bg:#0d0f11; --panel:#15181b; --line:#3a3f45; --text:#e6e6e6; --accent:#6fd68a; --danger:#e06868; }
  * { box-sizing: border-box; }
  body { background:var(--bg); color:var(--text); font-family: ui-monospace, "Courier New", monospace; margin:0; padding:24px; }
  h1 { text-align:center; font-weight:normal; font-size:18px; letter-spacing:1px; }
  .panel { border:1px solid var(--line); border-radius:10px; padding:16px; max-width:640px; margin:0 auto; }
  .box { border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:16px; }
  .row { display:flex; gap:12px; }
  .col { flex:1; }
  .stats { display:grid; grid-template-columns: repeat(2,1fr); gap:6px 16px; font-size:13px; }
  .stats span.k { color:#9aa0a6; }
  button { background:transparent; color:var(--text); border:1px solid var(--line); border-radius:6px;
           padding:10px; width:100%; font-family:inherit; cursor:pointer; margin-bottom:8px; }
  button:hover { border-color:var(--accent); }
  button.active { border-color:var(--accent); color:var(--accent); }
  button.danger:hover { border-color:var(--danger); color:var(--danger); }
  .label { font-size:12px; color:#9aa0a6; text-align:center; margin-bottom:6px; }
  select, input[type=text] { width:100%; background:var(--panel); color:var(--text); border:1px solid var(--line);
           border-radius:6px; padding:8px; margin-bottom:8px; font-family:inherit; }
  input[type=number] { background:var(--panel); color:var(--text); border:1px solid var(--line);
           border-radius:6px; padding:6px; font-family:inherit; }
  input[type=range] { width:100%; accent-color: var(--accent); }
  .footer-row { display:flex; gap:12px; }
  .joint-row { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .joint-row .jname { width:76px; font-size:13px; flex-shrink:0; }
  .joint-row .jslider { flex:1; }
  .joint-row .jval { width:60px; flex-shrink:0; }
  .joint-row .jmax { width:56px; flex-shrink:0; }
  .joint-row .jmaxlabel { font-size:11px; color:#9aa0a6; flex-shrink:0; }
  #joint-box.disabled { opacity:0.45; pointer-events:none; }
</style>
</head>
<body>
<h1>Robotic Arm Commander</h1>
<div class="panel">

  <div class="box stats" id="stats">
    <span class="k">mode</span><span id="s-mode">-</span>
    <span class="k">connected</span><span id="s-conn">-</span>
    <span class="k">latency</span><span id="s-lat">-</span>
    <span class="k">angles</span><span id="s-angles">-</span>
    <span class="k">recording</span><span id="s-rec">-</span>
    <span class="k">replaying</span><span id="s-replay">-</span>
  </div>

  <div class="row">
    <div class="col box">
      <div class="label">modes</div>
      <button id="btn-live">live mode</button>
      <button id="btn-replay-mode">replay mode</button>
    </div>
    <div class="col box">
      <div class="label">replay profile</div>
      <select id="profile-select"></select>
      <input type="file" id="import-file" accept=".csv">
      <button id="btn-import">import</button>
      <button id="btn-export">export</button>
    </div>
  </div>

  <div class="box" id="joint-box">
    <div class="label">manual joint control — live mode only</div>
    <div id="joint-rows"></div>
  </div>

  <div class="box">
    <div class="label">claw</div>
    <div class="row" style="margin-bottom:8px;">
      <button id="claw-close">close</button>
      <button id="claw-open">open</button>
      <button id="claw-stop">stop</button>
    </div>
    <div class="label">duty (pwm 0-255)</div>
    <div class="row">
      <div class="col"><input type="range" id="claw-duty" min="0" max="255" value="180" style="width:100%"></div>
      <input type="number" id="claw-duty-num" min="0" max="255" value="180" style="width:70px">
    </div>
  </div>

  <div class="box">
    <div class="label">live mode controls</div>
    <button id="btn-record">start recording</button>
    <button id="btn-replay-start">start replay (selected profile)</button>
  </div>

  <div class="footer-row">
    <button class="danger" id="btn-stop">stop arm</button>
    <button id="btn-home">start / home arm</button>
  </div>

</div>

<script>
const $ = id => document.getElementById(id);

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) {
    const body = await res.json().catch(() => ({error: res.statusText}));
    throw new Error(body.error || res.statusText);
  }
  const ct = res.headers.get('content-type') || '';
  return ct.includes('application/json') ? res.json() : null;
}

let recording = false;

const JOINT_NAMES = ['Base', 'Shoulder', 'Elbow', 'Wrist'];
let jointMax = [180, 180, 180, 180]; // dashboard slider range only — the ESP32
                                      // firmware clamps to its real per-joint
                                      // limits regardless of what's shown here
let liveMode = false;
let draggingJoint = null; // index of a slider currently being dragged, or null

function buildJointRows() {
  const container = $('joint-rows');
  container.innerHTML = '';
  JOINT_NAMES.forEach((name, i) => {
    const row = document.createElement('div');
    row.className = 'joint-row';
    row.innerHTML = `
      <span class="jname">${name}</span>
      <input type="range" class="jslider" id="jslider-${i}" min="0" max="${jointMax[i]}" step="0.1" value="90">
      <input type="number" class="jval" id="jval-${i}" min="0" max="${jointMax[i]}" step="0.1" value="90">
      <span class="jmaxlabel">max</span>
      <input type="number" class="jmax" id="jmax-${i}" min="1" max="360" value="${jointMax[i]}">
    `;
    container.appendChild(row);

    const slider = row.querySelector(`#jslider-${i}`);
    const val = row.querySelector(`#jval-${i}`);
    const maxInput = row.querySelector(`#jmax-${i}`);

    const sendJoint = (deg) => api('/api/joint', {
      method: 'POST',
      body: JSON.stringify({ joint: i, deg: parseFloat(deg) })
    }).catch(e => console.warn('joint set failed:', e.message));

    slider.addEventListener('input', () => { val.value = slider.value; sendJoint(slider.value); });
    slider.addEventListener('pointerdown', () => { draggingJoint = i; });
    slider.addEventListener('pointerup', () => { draggingJoint = null; });
    val.addEventListener('change', () => { slider.value = val.value; sendJoint(val.value); });
    maxInput.addEventListener('change', () => {
      const m = parseFloat(maxInput.value) || 180;
      jointMax[i] = m;
      slider.max = m;
      val.max = m;
    });
  });
}

$('claw-close').onclick = () => api('/api/claw', {method:'POST', body: JSON.stringify({direction:1, duty: parseInt($('claw-duty-num').value,10)})});
$('claw-open').onclick  = () => api('/api/claw', {method:'POST', body: JSON.stringify({direction:-1, duty: parseInt($('claw-duty-num').value,10)})});
$('claw-stop').onclick  = () => api('/api/claw', {method:'POST', body: JSON.stringify({direction:0, duty:0})});
$('claw-duty').addEventListener('input', () => { $('claw-duty-num').value = $('claw-duty').value; });
$('claw-duty-num').addEventListener('change', () => { $('claw-duty').value = $('claw-duty-num').value; });

buildJointRows();

async function refreshStats() {
  try {
    const s = await api('/api/stats');
    $('s-mode').textContent = s.mode;
    $('s-conn').textContent = s.connected ? 'yes' : 'NO — check UART';
    $('s-lat').textContent = s.connected ? s.latency_ms + ' ms' : '-';
    $('s-angles').textContent = s.angles.join(', ');
    $('s-rec').textContent = s.recording ? `yes (${s.recorded_steps} steps)` : 'no';
    $('s-replay').textContent = s.replaying ? 'yes' : 'no';

    $('btn-live').classList.toggle('active', s.mode === 'live');
    $('btn-replay-mode').classList.toggle('active', s.mode === 'replay');
    recording = s.recording;
    $('btn-record').textContent = recording ? 'stop recording' : 'start recording';

    liveMode = s.mode === 'live';
    $('joint-box').classList.toggle('disabled', !liveMode);

    // Keep sliders in sync with the arm's actual commanded angles
    // (e.g. after Home, xbox jogging, or a replay) — but don't yank a
    // slider out from under the user's finger mid-drag.
    s.angles.forEach((deg, i) => {
      if (draggingJoint === i) return;
      const slider = $(`jslider-${i}`);
      const val = $(`jval-${i}`);
      if (slider && document.activeElement !== val) {
        slider.value = deg;
        val.value = deg.toFixed(1);
      }
    });
  } catch (e) {
    $('s-conn').textContent = 'server unreachable';
  }
}

async function refreshProfiles() {
  const profiles = await api('/api/profiles');
  const sel = $('profile-select');
  sel.innerHTML = '';
  (profiles || []).forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.id;
    opt.textContent = `${p.name} (${p.steps.length} steps)`;
    sel.appendChild(opt);
  });
}

$('btn-live').onclick = () => api('/api/mode', {method:'POST', body: JSON.stringify({mode:'live'})}).then(refreshStats);
$('btn-replay-mode').onclick = () => api('/api/mode', {method:'POST', body: JSON.stringify({mode:'replay'})}).then(refreshStats);
$('btn-home').onclick = () => api('/api/home', {method:'POST'}).then(refreshStats);
$('btn-stop').onclick = () => api('/api/stop', {method:'POST'}).then(refreshStats);

$('btn-record').onclick = async () => {
  if (!recording) {
    await api('/api/record/start', {method:'POST'});
  } else {
    const name = prompt('profile name', 'profile-' + Date.now());
    if (name === null) return;
    await api('/api/record/stop', {method:'POST', body: JSON.stringify({name})});
    await refreshProfiles();
  }
  refreshStats();
};

$('btn-replay-start').onclick = async () => {
  const id = parseInt($('profile-select').value, 10);
  if (!id) { alert('no profile selected'); return; }
  await api('/api/replay/start', {method:'POST', body: JSON.stringify({id})});
  refreshStats();
};

$('btn-import').onclick = async () => {
  const f = $('import-file').files[0];
  if (!f) { alert('choose a CSV file first'); return; }
  const form = new FormData();
  form.append('file', f);
  form.append('name', f.name.replace(/\.csv$/i, ''));
  await api('/api/profiles/import', {method:'POST', body: form});
  await refreshProfiles();
};

$('btn-export').onclick = () => {
  const id = parseInt($('profile-select').value, 10);
  if (!id) { alert('no profile selected'); return; }
  window.location = '/api/profiles/export?id=' + id;
};

refreshStats();
refreshProfiles();
setInterval(refreshStats, 1000);
</script>
</body>
</html>
